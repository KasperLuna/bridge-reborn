name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: self-hosted
    env:
      NEXT_PUBLIC_POCKETBASE_URL: ${{ secrets.NEXT_PUBLIC_POCKETBASE_URL }}
      POCKETBASE_URL: ${{ secrets.POCKETBASE_URL }}
      POCKETBASE_ADMIN_EMAIL: ${{ secrets.POCKETBASE_ADMIN_EMAIL }}
      POCKETBASE_ADMIN_PASSWORD: ${{ secrets.POCKETBASE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Align PocketBase schema
        run: |
          net="$(docker inspect "$(docker compose ps -q pocketbase)" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')"
          docker run --rm \
            --network "$net" \
            -e POCKETBASE_URL="$POCKETBASE_URL" \
            -e POCKETBASE_ADMIN_EMAIL="$POCKETBASE_ADMIN_EMAIL" \
            -e POCKETBASE_ADMIN_PASSWORD="$POCKETBASE_ADMIN_PASSWORD" \
            -v "$PWD:/work" -w /work \
            node:22-alpine node scripts/import-schema.mjs